<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font:14px system-ui,-apple-system,sans-serif}
img{max-width:100%}

<title>여수광양항만공사 면접노트</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@600&display=swap">
<style>
/* 레이아웃: 상단 고정 바(검색·모드) + 가로 스크롤 탭 + 단일 칼럼 카드 스택 */
:root{
  --bg:#F3F6F8; --surface:#FFFFFF; --surface-2:#EAF0F5; --line:#D7E0E8;
  --fg:#131A21; --muted:#596876; --accent:#0E4C73; --accent-soft:#DCEBF6;
  --warn:#9A4E0C; --warn-soft:#FBEBDC; --ok:#1C6B4B; --ok-soft:#DCEFE5; --on-accent:#FFFFFF;
  --f-body:'Noto Sans KR',system-ui,-apple-system,'Malgun Gothic',sans-serif;
  --f-head:'Noto Serif KR','Noto Sans KR',serif;
  --r:10px; --shadow:0 1px 2px rgba(16,36,56,.06),0 6px 18px rgba(16,36,56,.05);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0D1319; --surface:#151D25; --surface-2:#1C262F; --line:#28343E;
  --fg:#E7EEF4; --muted:#94A4B3; --accent:#6FB2DC; --accent-soft:#17303F;
  --warn:#E3A463; --warn-soft:#38271A; --ok:#78C8A4; --ok-soft:#172C24; --on-accent:#0D1319;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.3); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0D1319; --surface:#151D25; --surface-2:#1C262F; --line:#28343E;
  --fg:#E7EEF4; --muted:#94A4B3; --accent:#6FB2DC; --accent-soft:#17303F;
  --warn:#E3A463; --warn-soft:#38271A; --ok:#78C8A4; --ok-soft:#172C24; --on-accent:#0D1319;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.3); color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.62;margin:0;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
.wrap{max-width:860px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* 상단 바 */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{padding-block:10px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.brand{display:flex;flex-direction:column;min-width:0;flex:1 1 180px}
.brand b{font-family:var(--f-head);font-size:16px;font-weight:600;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand span{font-size:11.5px;color:var(--muted);letter-spacing:.02em}
.tools{display:flex;gap:8px;align-items:center;flex:1 1 220px;min-width:0}
#q{flex:1 1 auto;min-width:0;font:inherit;font-size:14px;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:8px 14px}
#q:focus{outline:2px solid var(--accent);outline-offset:1px}
button{font:inherit;cursor:pointer;color:var(--fg);background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:7px 13px;font-size:13px;white-space:nowrap}
button:hover{border-color:var(--accent)}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}

/* 탭 */
nav.tabs{position:sticky;top:calc(env(safe-area-inset-top,0px) + 56px);z-index:19;background:var(--bg);border-bottom:1px solid var(--line)}
.tabs .scroller{display:flex;gap:6px;overflow-x:auto;padding-block:8px;scrollbar-width:thin}
.tabs button{flex:0 0 auto;background:transparent;border-color:transparent;color:var(--muted);padding:6px 11px}
.tabs button .n{font-variant-numeric:tabular-nums;opacity:.55;margin-right:5px;font-size:11px}
.tabs button[aria-selected="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:700}

/* 전략 요약 */
.strategy{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px;margin:16px 0 4px}
.strategy div{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:var(--r);padding:11px 13px;box-shadow:var(--shadow)}
.strategy b{display:block;font-size:12px;letter-spacing:.04em;color:var(--accent);margin-bottom:3px}
.strategy p{margin:0;font-size:13.5px;color:var(--muted);line-height:1.5}

/* 시트 */
section.sheet{padding-block:14px 48px}
h2.sheet-title{font-family:var(--f-head);font-weight:600;font-size:19px;line-height:1.4;margin:10px 0 4px;text-wrap:balance}
p.sheet-note{background:var(--warn-soft);color:var(--warn);border-radius:var(--r);padding:10px 13px;font-size:13px;margin:10px 0 18px;white-space:pre-wrap}
.counter{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
h3.group{font-size:13px;letter-spacing:.06em;color:var(--accent);margin:26px 0 10px;padding-bottom:7px;border-bottom:1px solid var(--line);font-weight:700}

/* 카드 */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);margin-bottom:10px;box-shadow:var(--shadow);overflow:hidden}
.card.done{border-color:var(--ok)}
.chead{display:flex;gap:10px;align-items:flex-start;padding:13px 14px;cursor:pointer}
.chead:hover{background:var(--surface-2)}
.num{flex:0 0 auto;font-variant-numeric:tabular-nums;font-size:12px;font-weight:700;color:var(--accent);background:var(--accent-soft);border-radius:6px;padding:2px 7px;margin-top:2px}
.qtext{flex:1 1 auto;min-width:0}
.tag{display:inline-block;font-size:11px;color:var(--muted);background:var(--surface-2);border-radius:5px;padding:1px 7px;margin-bottom:5px}
.qtext .q{font-family:var(--f-head);font-weight:600;font-size:15.5px;line-height:1.55;display:block}
.mark{flex:0 0 auto;background:transparent;border:1px solid var(--line);border-radius:999px;width:30px;height:30px;padding:0;font-size:13px;color:var(--muted);line-height:1}
.card.done .mark{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.cbody{padding:0 14px 14px;display:grid;gap:12px}
.card.collapsed .cbody{display:none}
.fld{display:grid;gap:3px}
.fld>b{font-size:11px;letter-spacing:.06em;color:var(--muted);font-weight:700}
.fld>div{white-space:pre-wrap;word-break:break-word}
.answer{background:var(--accent-soft);border-radius:8px;padding:11px 13px;font-size:14.5px;line-height:1.72}
.ph{background:var(--warn-soft);color:var(--warn);border-radius:4px;padding:0 3px;font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{font-size:12px;background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:2px 9px;color:var(--fg)}
.tip{font-size:13px;color:var(--muted);border-left:2px solid var(--line);padding-left:10px}
.star{color:var(--warn);font-weight:700}

/* 표 형식 카드 */
.row{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin-bottom:9px;box-shadow:var(--shadow);display:grid;gap:7px}
.row .rt{font-weight:700;font-size:15px;line-height:1.5}
.row .meta{display:flex;flex-wrap:wrap;gap:5px}
.row dl{margin:0;display:grid;gap:6px}
.row dt{font-size:11px;letter-spacing:.05em;color:var(--muted);font-weight:700}
.row dd{margin:0;white-space:pre-wrap;word-break:break-word;font-size:14px}
.chk{display:flex;gap:10px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:11px 13px;margin-bottom:7px;box-shadow:var(--shadow);cursor:pointer}
.chk input{margin:3px 0 0;width:17px;height:17px;accent-color:var(--accent);flex:0 0 auto}
.chk .t{flex:1 1 auto;min-width:0}
.chk .t b{display:block;font-weight:500;font-size:14.5px;line-height:1.5}
.chk .t span{font-size:12.5px;color:var(--muted);display:block;margin-top:2px}
.chk.on .t b{text-decoration:line-through;opacity:.5}
.hit{font-size:11px;color:var(--muted);margin-bottom:5px}
.empty{color:var(--muted);text-align:center;padding:50px 0;font-size:14px}
footer{border-top:1px solid var(--line);padding-block:18px 30px;font-size:12px;color:var(--muted);line-height:1.7}
@media (max-width:520px){
  .brand{flex:1 1 100%}
  nav.tabs{top:calc(env(safe-area-inset-top,0px) + 92px)}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

</head>

 항만종사자 한랭질환 예방 캠페인", "공사 보도자료에 '여수광양항만공사, 항만종사자 한랭질환 예방 캠페인 실시' 게시. 겨울철 옥외 항만작업 종사자 대상.", "★ 바로 보건직 업무입니다. 면접이 12월이라 시의성 만점. '제가 입사하면 이 캠페인을 이렇게 발전시키겠다'로 구체안을 준비하세요."], ["4", "2026.04.21", "★ 공정안전·공정위험성평가 교육", "전남권 중대산업사고예방센터장을 강사로 초빙. 수소폭발 사고, 포스겐 누출 사고, 개스킷 교체 작업 시 누출 사고 등 사고원인 분석 및 재발 방지 대책 교육.", "★ 여수산단 석유화학 특성이 그대로 드러남. 화학물질 보건관리(MSDS·국소배기·특수건강진단)와 직결되는 소재."], ["5", "2026.10월말", "★ 재난대응 안전한국훈련 (복합재난)", "여수해양경찰서·여수소방서 등 24개 관계기관 및 업·단체 150여 명 참여. 사장은 국내 항만 최초로 도입한 '조기경보 시스템'의 현장 정착을 강조.", "★ 응급조치·재난 시 보건 역할과 연결. \"훈련에 보건 시나리오(다수사상자 분류·응급처치)를 넣겠다\"는 제안이 가능."], ["■ 경영 · 리더십"], ["6", "2026.04.10", "제6대 최관호 사장 취임", "해양수산부가 최관호 전 서울경찰청장을 제6대 사장으로 임명(임기 2029.4.9., 성과에 따라 1년 단위 연임). 공모 18명 지원, 임추위가 5명 추천. 전남·광주경찰청장, 경찰청 기획조정관 등 역임. 취임사에서 북극항로 개척 대비 중장기 전략과 스마트 항만 구축, '3년 내 국가경제 견인 핵심항만 도약' 강조.", "현 사장 이름을 정확히 아는 지원자는 많지 않습니다. 경찰 출신 CEO → 안전·질서·현장관리·규율을 중시할 가능성. 답변에 '현장'과 '원칙'을 자주 넣으면 코드가 맞습니다."], ["7", "2026.01.02", "2026년 시무식 — 4대 과제", "① 도전하는 미래 항만으로의 전환 ② 안전이 기본이 되는 지속가능한 항만 ③ 지역과 함께 성장하는 항만 ④ 창의적이고 혁신이 존중받는 조직.", "②번이 보건직의 자리입니다. \"안전이 기본이 되는 지속가능한 항만, 그 기본의 한 축이 근로자 건강입니다\"는 문장을 외워 두세요."], ["8", "2026년", "\"관리하는 항만 → 설계하는 항만\" 대전환", "2026년을 미래 항만으로의 대전환을 준비하는 원년으로 선언. 북극항로 개척을 핵심 과제로 제시.", "보건에도 적용 가능 : \"사고가 난 뒤 관리하는 보건이 아니라, 나기 전에 설계하는 보건\"."], ["9", "2026년", "지속가능경영품질대상 수상 (ESG)", "공기업 부문 수상. 안전·환경·사회적 가치 성과 인정.", "ESG의 S(사회)에서 '근로자 건강과 안전'이 핵심 지표임을 설명할 수 있어야 합니다."], ["■ 주요 사업 (반드시 아는 척이 아니라 정확히)"], ["10", "2026.10.06~11.24", "광양항 3-2단계 자동화 컨테이너부두 운영사 모집", "4,000TEU급 3선석 + 2,000TEU급 1선석 = 총 4선석, 안벽길이 1,300m. QC 8기, ARMGC 32기, AGV 44기 도입 예정. 2029년 상반기 개장 목표, 총사업비 7,724억원, 연간 하역능력 136만TEU. 공사가 자동화 하역장비와 터미널운영시스템(TOS) 핵심 인프라를 직접 구축해 운영사 초기 투자부담 경감. 운영사 모집은 11.24. 마감.", "★ 보건 관점 질문이 나올 수 있음 : 자동화되면 추락·협착 재해는 줄지만 원격관제실 VDT증후군·교대제 수면장애·직무스트레스·고립작업(단독작업) 위험은 새로 생깁니다. 이 대비를 말하면 차별화됩니다."], ["11", "2026년", "북극항로 개척 / 첫 컨테이너 시범운항", "정부 지원 첫 컨테이너 북극항로 운항은 사전 수요 약 1,300TEU였으나 실제 수출화물 737TEU (공컨테이너 포함 837TEU)로 2,758TEU급 선박 적재능력의 약 30% 수준. 경제성은 시험대.", "장밋빛으로만 말하지 마세요. '기회이자 아직 검증 단계'라는 균형 잡힌 시각이 더 신뢰를 줍니다. 보건 접점은 한랭지 운항 선원·항만근로자의 한랭질환 관리."], ["12", "2026년", "광양항 컨테이너 물동량 정체", "2025년 약 205~206만TEU(전년比 +2%)로 2018년 최고치 241만TEU에 미달. 2026년 3분기 49.9만TEU로 1.0% 감소(환적 +50.2%, 수출입 -6.7%). 광양항 배후 지역기업 컨테이너 화물의 33%가 타 항만을 이용.", "공사의 아픈 곳입니다. 먼저 꺼내지 말고, 물으면 사실관계만 담담히 말한 뒤 \"직원과 항만근로자가 건강해야 영업도 현장도 돌아간다\"로 본인 역할에 연결하세요."], ["13", "2026.06.25", "석유화학산업 위기 극복·상생협력 간담회", "여수광양항 주요 고객사 15개 기업이 참석. 석유화학산업 위기 극복과 상생협력 방안 모색.", "여수광양항 화물의 중심이 석유화학·제철이라는 점을 보여주는 소식. 화학물질 보건관리의 중요성을 설명할 때 근거로 쓰세요."], ["14", "2026.11.06", "전기안전관리자 협의회 / BIXPO 2026 참관", "항만 설비의 안전한 운용을 위한 협의회 개최. 에너지 AI·디지털 트윈 기반 첨단 설비관리 솔루션 공유.", "\"설비 안전에 AI·디지털 트윈을 쓰듯, 보건에도 데이터를 쓰겠다\"(건강검진·작업환경측정 결과의 추세관리)로 연결 가능."], ["■ 지역 상생 · 기타"], ["15", "2026년", "도서민 휴게공간 확대 조성", "\"섬 주민의 기다림이 편안해진다\" — 여객터미널 등 도서민 휴게공간 확대.", "공사가 '항만 이용자 편의·복지'까지 책임진다는 사례. 생활근린·복지사업은 공사 주요사업에 명시돼 있습니다."], ["16", "2026년", "LED 보조신호등 설치 / 여수 지역화주 초청 설명회", "항만 내 교통안전 개선, 여수 지역화주 초청 '여수광양항 설명회' 개최.", "'작은 개선이 사고를 막는다'는 예시로 쓰기 좋습니다."], ["17", "2026년", "중국 닝보저우산항과 전략 협력 강화", "세계 1위 물동량 항만과의 협력 확대.", "국제 협력 질문 대비용. 깊이 들어갈 필요는 없습니다."], ["■ 알아두면 좋은 기본 정보"], ["18", "상시", "공사 주요사업 (직무기술서 원문)", "① 항만시설의 신설·개축·유지보수·준설 등 공사 시행 및 항만 관리·운영 ② 국가·지자체 위탁사업 ③ 조사·연구, 기술개발, 인력양성 ④ 항만이용자 편의를 위한 생활근린 및 복지사업 건설·운영 ⑤ 외국항만 조성·관리·운영 ⑥ 미래해양사업, 해양복합단지, 지역상생형 박람회장 운영 등 해양복합사업", "\"공사가 어떤 일을 하는지 아십니까\"에 이 6가지로 답하면 준비된 사람으로 보입니다."], ["19", "상시", "여수광양항의 성격", "★ 정확한 순위: 수출입 물동량(환적 제외) 국내 1위 / 총 물동량 국내 2위(1위는 부산항) / 컨테이너 물동량 국내 3위 / 비컨테이너(철강·석유화학) 화물 국내 1위. 여수·광양 국가산단(석유화학·제철) 배후. 컨테이너·자동차·일반화물·위험물(액체화물) 복합 취급. 자동차 누적 처리 1,000만대 달성 이력.", "★★ '국내 최대 항만'이라고 말하면 안 됩니다. 총 물동량 1위는 부산항입니다. 공사 보도자료가 쓰는 표현 그대로 '수출입 물동량 국내 1위'라고 하세요. 여기서 틀리면 면접위원이 바로 압니다. / 위험물·액체화물 비중이 높다 = 화학적 유해인자 노출 위험이 크다 → 보건관리자의 존재 이유."], ["20", "상시", "항만안전특별법상 공사의 역할", "항만하역사업자는 자체안전관리계획을 수립해 관리청 승인을 받아야 함. 관리청에 항만안전점검관을 두며, 항만공사 소속 직원은 '항만안전점검요원'으로 지정되어 점검관의 지휘·감독 아래 승인·이행확인·시정조치 관련 현장 확인·조사·점검 업무를 지원.", "★ 공사 직원이 법적으로 현장 점검에 들어간다는 뜻. \"저도 항만안전점검요원으로서 하역현장의 보건 항목을 보겠다\"는 답변이 가능합니다. 아는 지 ", "근거 확인 → 비공개로 설명 → 대안 제시 → 기록 → 공식 절차", "순서대로 말하는 것이 중요합니다. 바로 '신고하겠다'고 하면 조직 부적응으로 봅니다."], ["5", "조직이해", "무기계약직으로 지원하셨는데, 정규직 전환이나 처우에 대한 불만이 생기면 어떻게 하시겠습니까?", "지원 동기의 진정성 / 장기근속 가능성", "저는 이 자리를 '덜한 자리'라고 생각하지 않습니다. 보건관리자는 법으로 선임이 정해진 자리이고, 공사가 7년 연속 중대재해 제로를 이어가는 데 반드시 필요한 역할입니다. 직급보다 제가 맡은 영역에서 대체 불가능한 사람이 되는 것이 먼저라고 생각합니다. 처우에 대한 의견이 있다면 개인적인 불만으로 쌓아두기보다 공식적인 창구를 통해 말씀드리는 것이 맞다고 생각하고, 그 전에 제가 맡은 일로 신뢰를 쌓는 것이 순서라고 봅니다.", "법정 선임 직무 / 대체 불가능한 역할 / 공식 창구", "불만을 아예 없다고 하면 거짓말로 들립니다. '순서'를 말하는 것이 현실적입니다."], ["■ 의사소통 · 대인관계"], ["6", "의사소통", "상대방을 설득해 본 경험을 말씀해 주세요.", "설득의 방법론이 있는가 (보건직은 설득이 업무의 절반)", "[상황] 제가 [○○에서 근무할 때], [보호구 착용을 꺼리던 작업자 / 검사를 거부하던 환자]가 있었습니다. [과제] 규정을 말해도 통하지 않았습니다. [행동] 저는 먼저 왜 싫은지를 물었습니다. 이유가 [더워서 / 불편해서 / 무서워서]였기 때문에, 규정을 반복하는 대신 [실제 불편을 줄이는 대안 / 본인에게 생길 결과를 구체적으로 설명]했습니다. [결과] [○○일 만에 착용률이 ○%로 올랐고 / 결국 검사를 받으셨고], 그 뒤로는 제가 말하기 전에 먼저 챙기셨습니다. 그때 설득은 더 센 말이 아니라 상대의 이유를 아는 데서 시작한다는 걸 배웠습니다.", "상대의 이유를 먼저 묻는다 / 규정 반복이 아닌 대안 / 수치로 된 결과", "★ S-T-A-R 구조. 결과를 반드시 변화로 끝내세요. 보건직 면접에서 가장 자주 나오는 유형입니다."], ["7", "대인관계", "동료나 다른 부서와 갈등이 있었던 경험과 해결 방법을 말씀해 주세요.", "갈등을 남 탓으로 돌리는가", "[상황] [○○ 업무에서 ○○부서와 일정·방식이 부딪힌 적이 있습니다]. [과제] 서로 자기 쪽 사정만 말하다 보니 진척이 없었습니다. [행동] 저는 각자 무엇을 가장 걱정하는지 한 줄로 적어 보자고 제안했습니다. 적어 놓고 보니 실제로 부딪히는 부분은 전체가 아니라 [○○ 한 가지]였습니다. [결과] 그 한 가지만 조정해 [○○일 안에 마무리]했습니다. 갈등은 대개 전부가 아니라 한두 지점에서 생기고, 그 지점을 눈에 보이게 만들면 풀린다는 것을 배웠습니다.", "쟁점 분리 / 눈에 보이게 적기 / 상대의 우려 확인", "상대를 비난하는 서술은 절대 금지. '저도 처음엔 제 입장만 말했다'는 자기반성이 들어가면 성숙해 보입니다."], ["8", "의사소통", "현장 근로자들은 보건담당자를 '귀찮게 하는 사람'으로 볼 수 있습니다. 어떻게 하시겠습니까?", "★ 보건직의 현실을 아는가", "그렇게 보이는 것이 당연하다고 생각합니다. 저는 작업을 멈추게 하고, 시간을 쓰게 하고, 불편한 보호구를 쓰라고 하는 사람이기 때문입니다. 그래서 두 가지를 하겠습니다. 첫째, 제가 요구하기 전에 먼저 하나를 해결해 드리겠습니다. 휴게실 환기나 세면시설처럼 바로 바꿀 수 있는 작은 불편을 먼저 고치면, 그다음 요구는 다르게 들립니다. 둘째, 얼굴을 자주 보이겠습니다. 사고가 났을 때만 나타나는 사람이 아니라, 평소에 현장을 걸어다니며 인사하는 사람이 되면 '검사하러 온 사람'이 아니라 '우리 쪽 사람'이 됩니다.", "먼저 하나 해결해 주기 / 평소에 얼굴 보이기 / 우리 쪽 사람 되기", "★ 이 질문에 '교육을 강화하겠다'고 답하면 평범합니다. '먼저 해 준다'가 핵심."], ["9", "대인관계", "나이가 많거나 경력이 오래된 분들과 일해야 합니다. 어려움이 없겠습니까?", "현장  "[네, 저는 현재 ○○에 거주하고 있어 출퇴근에 문제가 없습니다 / 가족이 ○○에 있어 이 지역에 정착할 계획입니다.] 보건관리자는 한 사업장을 오래 봐야 의미가 있는 자리라고 생각합니다. 작업환경과 건강 데이터는 몇 년을 모아야 추세가 보이고, 현장의 신뢰도 시간이 쌓여야 생깁니다. 저는 여기서 오래 일하며 그 데이터를 쌓고 싶습니다.", "지역 연고 / 보건은 시간이 쌓여야 의미가 있는 일", "★ 거주지 질문은 사실대로. 그 뒤에 '오래 해야 의미 있는 직무'라는 논리를 붙이세요."], ["20", "협업", "안전 담당자와 보건 담당자의 역할은 어떻게 다르다고 보십니까?", "조직 내 자기 위치를 아는가", "안전은 주로 사고, 즉 즉시 드러나는 위험을 다루고 보건은 주로 질병, 즉 시간이 지나 드러나는 위험을 다룬다고 생각합니다. 추락이나 협착은 바로 보이지만, 소음성 난청이나 근골격계질환, 화학물질 만성 노출은 몇 년 뒤에 나타납니다. 그래서 두 역할은 나뉘는 것이 아니라 같은 현장을 다른 시간축으로 보는 것이라고 봅니다. 위험성평가도 안전분야와 보건분야를 따로 하지만 결국 같은 공정을 보는 것이므로, 저는 안전 담당자와 현장점검을 함께 다니며 서로 놓친 것을 채우고 싶습니다.", "사고 vs 질병 / 즉시 드러남 vs 시간이 지나 드러남 / 같은 현장, 다른 시간축", "★ '같은 현장을 다른 시간축으로 본다'는 표현이 인상적입니다. 그대로 쓰세요."], ["21", "고객지향", "공사 직원이 아닌 하역사 근로자가 건강 문제로 찾아오면 어떻게 하시겠습니까?", "범위 밖 요청에 대한 태도", "일단 사람 먼저 보겠습니다. 급한 상태라면 소속을 따지기 전에 응급조치부터 하고 의료기관으로 연계하겠습니다. 급하지 않은 상담이라면, 제가 직접 관리할 수 있는 범위와 아닌 범위를 솔직히 말씀드리고 해당 사업장의 보건관리자나 전남권 근로자건강센터, 보건소 같은 이용 가능한 창구를 안내하겠습니다. 항만은 여러 회사가 한 공간에서 일하는 곳이라, 소속이 다르다고 돌려보내면 결국 그 위험이 같은 현장에 남습니다.", "응급은 소속 불문 / 범위는 솔직히 / 연계 창구 안내 / 같은 공간의 위험은 공유된다", "★ 공공기관의 사회적 가치와도 맞고, 월권하지 않는 균형도 보여줍니다."], ["22", "변화수용", "새로운 제도나 시스템 도입에 거부감은 없으십니까?", "개방성", "없습니다. 다만 새 제도를 도입할 때 가장 중요한 것은 현장이 그것을 쓸 수 있느냐라고 생각합니다. 좋은 시스템도 입력이 번거로우면 결국 아무도 쓰지 않고 이중 작업만 남습니다. 그래서 저는 새 것을 받아들이되, 현장 입장에서 한 단계라도 줄일 방법을 같이 고민하는 쪽으로 접근하겠습니다.", "개방적 수용 + 현장 사용성 / 이중 작업 방지", "무조건 찬성만 하면 가벼워 보입니다. 조건을 하나 다는 것이 좋습니다."], ["23", "마무리", "본인의 강점과 약점을 말씀해 주세요.", "자기객관화", "강점은 기록을 남기는 습관입니다. [○○ 업무를 하면서 ○○을 항상 문서로 정리했고, 그 덕분에 ○○한 적이 있습니다.] 보건 업무는 법정 기록이 많고, 기록이 없으면 한 일도 안 한 것이 되기 때문에 이 습관이 잘 맞는다고 생각합니다. 약점은 거절을 잘 못하는 편이라 일을 떠안을 때가 있다는 점입니다. 지금은 일을 받을 때 기한을 먼저 확인하고, 어려우면 그 자리에서 말씀드리는 연습을 하고 있습니다.", "기록 습관(직무기술서의 문서화 능력) / 약점 + 개선 노력", "★ 강점은 반드시 직무기술서의 '필요기술'에서 고르세요. 약점은 직무에 치명적이지 않은 것으로."], ["24", "마무리", "마지막으로 하고 싶은 말씀이 있습니까?", "마무리 인상", "오늘 면접을 준비하면서 공사가 7년 연속 중대재해 제로를 이어왔다는 것을 알게 됐습니다. 그 숫자는 누군가가 매년 같은 일을 빠짐없이 해냈다는 뜻이라고 생각합니다. 화려한 일은 아니지만 빠지면 바로 드러나는 일, 저는 그런 일을 꾸준히 하는 사람입니다. 여수광양항에서 일하는 분들 "먼저 이유를 듣겠습니다. 시간이 없어서인지, 결과가 회사에 알려질까 걱정해서인지, 결과 자체가 두려워서인지에 따라 방법이 다릅니다. 시간 문제라면 검진 일정을 조별로 나누거나 출장검진을 조율하고, 개인정보 걱정이라면 건강정보는 보호되며 회사에는 업무적합성 판정만 전달된다는 점을 설명드리겠습니다. 동시에 건강진단은 근로자의 수진 의무이기도 하다는 점을 안내드리겠습니다. 그래도 끝까지 거부하시면 안내한 사실을 기록으로 남기고 상급자와 산업보건의에게 보고하겠습니다. 강요보다는 설득이지만, 기록은 반드시 남기는 것이 서로를 보호하는 길이라고 생각합니다.", "이유 파악 → 맞춤 해결 / 개인정보 보호 설명 / 수진 의무 안내 / 거부 시 기록 보존", "★ '기록을 남긴다'는 어떤 상황 질문에서도 좋은 마무리입니다."], ["■ 응급조치"], ["13", "응급", "현장에서 근로자가 쓰러졌다는 연락을 받았습니다. 어떻게 하시겠습니까?", "★ 간호사 면허 소지자에게 반드시 나오는 질문", "현장으로 가면서 동시에 119 신고를 지시하겠습니다. 도착하면 먼저 현장이 안전한지를 확인합니다. 화학물질 누출이나 밀폐공간, 감전 상황이라면 제가 들어가는 순간 2차 재해가 되기 때문입니다. 안전이 확보되면 반응과 호흡을 확인하고, 반응과 정상 호흡이 없으면 즉시 가슴압박을 시작하며 AED를 요청하겠습니다. 의식이 있다면 증상과 발생 경위, 노출된 물질이 있는지를 확인해 119와 병원에 전달하겠습니다. 환자를 보낸 뒤에는 목격자 진술과 작업 내용을 기록하고, 같은 작업에 있던 다른 근로자들의 상태도 확인하겠습니다.", "① 119 ② 현장 안전 확인(2차 재해) ③ 반응·호흡 → CPR·AED ④ 노출물질 정보 전달 ⑤ 기록·동료 확인", "★★ 반드시 '현장 안전 확인'을 CPR보다 먼저 말하세요. 임상과 산업현장의 차이를 아는지 보는 질문입니다."], ["14", "응급", "사업장에 응급상황 대비로 무엇을 갖춰야 합니까?", "준비 체계", "장비, 사람, 절차 세 가지로 보겠습니다. 장비는 구급함과 AED인데, 구급함은 내용물과 유효기간을 정기 점검하고 AED는 위치가 현장에서 몇 분 거리인지와 배터리·패드 유효기간을 관리해야 합니다. 사람은 응급처치 교육 이수자를 교대조마다 확보하고 주기적으로 재교육하는 것입니다. 절차는 상황별 대응 흐름도와 비상연락망, 그리고 가장 가까운 응급의료기관까지의 경로와 소요시간을 미리 확인해 두는 것입니다. 특히 화학물질 취급 구역은 세안설비와 비상샤워가 작동하는지, MSDS상 응급조치 요령이 현장에 게시돼 있는지를 함께 보겠습니다.", "구급함·AED 유효기간 / 교대조별 응급처치 교육 이수자 / 비상연락망·이송경로 / 세안설비·비상샤워", "★ '세안설비·비상샤워'는 화학물질 취급 사업장 특유의 항목입니다. 넣으면 좋습니다."], ["■ 건강증진 · 정신건강"], ["15", "건강증진", "사업장 건강증진 프로그램을 기획한다면 무엇을 하시겠습니까?", "기획력 / 현실성", "먼저 자료를 보고 정하겠습니다. 건강진단 결과에서 유소견 비율이 가장 높은 항목이 무엇인지 보고, 보통은 혈압·혈당·이상지질혈증과 흡연·음주, 그리고 근골격계 증상이 상위에 올라옵니다. 그중 하나를 그해의 중점 과제로 정해 집중하겠습니다. 전 직원 대상 일회성 행사보다, 고위험군을 선정해 몇 개월간 상담과 추적을 하는 방식이 효과가 분명하다고 생각합니다. 다만 참여를 끌기 위해 전체 대상의 가벼운 활동도 함께 두겠습니다. 끝나면 참여율이 아니라 변화한 수치로 평가하겠습니다.", "데이터 기반 과제 선정 / 고위험군 집중관리 / 일회성 행사 지양 / 참여율이 아닌 수치 변화로 평가", "★ '참여율이 아니라 수치 변화로 평가한다'가 결정적 한마디입니다."], ["16", "정신건강", "직무스트레스 관리는 어떻게 하시겠습니까?", "직무기술서에 '정신적 건강'이 명시됨", "직무스트레스는 개인의 문제로 보기 쉽지만 관리 대상이 되는 작업요인이라고 생각합니다. 먼저 직무스트레스 요인 측정도구로 현황을 파악해, 어느 부 . 감사합니다.", "관찰-기록-조치 / 치료가 아닌 예방 / 여수광양항의 특수성 / 7년 연속 제로", "★★ 55~60초. 경력 나열 금지. '왜 산업보건인가 → 왜 이 항만인가' 두 질문에 답하는 구조여야 합니다. 마지막 문장은 반드시 공사 이야기로."], ["2", "★★ 지원동기", "왜 우리 공사에 지원하셨습니까?", "진정성 / 다른 데 떨어져서 온 것 아닌지", "세 가지 이유가 있습니다. 첫째, 현장이 분명해서입니다. 여수광양항은 액체화물과 위험물 비중이 높고 옥외작업과 24시간 교대가 함께 있어, 산업보건이 교과서가 아니라 매일의 실무가 되는 곳입니다. 둘째, 조직의 방향이 맞아서입니다. 공사는 올해 노사가 함께 안전보건경영방침을 선포했고, 시무식에서도 '안전이 기본이 되는 지속가능한 항만'을 과제로 내세웠습니다. 보건이 곁가지가 아니라 기본으로 놓인 조직에서 일하고 싶었습니다. 셋째, 오래 할 수 있어서입니다. 보건관리는 몇 년치 데이터가 쌓여야 비로소 추세가 보이는 일인데, 한 현장을 오래 맡을 수 있는 자리라는 점이 저에게는 큰 매력이었습니다.", "① 현장이 분명 ② 조직의 방향(노사 합동 방침) ③ 오래 할 수 있는 일", "★★ '안정적이라서' 금지. 세 가지 중 ②번이 공사 조사를 했다는 증거가 됩니다."], ["3", "★ 포부", "입사 후 포부를 말씀해 주십시오.", "장기 비전 / 조직 기여도", "단기, 중기, 장기로 말씀드리겠습니다. 첫해에는 현장과 기록을 정확히 파악해 법정 의무에 빈틈이 없게 만들겠습니다. 건강진단, 작업환경측정, 보건교육, 근골격계 유해요인조사가 주기대로 돌아가고 결과가 개선으로 이어지는 상태를 만드는 것이 첫 목표입니다. 3년 안에는 데이터를 쌓아 공정별로 어디서 유소견자가 늘고 있는지를 보여주는 보건 자료를 만들고 싶습니다. 그래야 예산과 개선이 근거를 갖습니다. 더 길게는, 공사 울타리를 넘어 하역사와 협력사까지 함께 쓰는 보건 체계를 만들고 싶습니다. 7년 연속 중대재해 제로가 공사만의 기록이 아니라 여수광양항 전체의 기록이 되는 것이 제 목표입니다.", "1년 법정 의무 완결 / 3년 데이터 기반 / 장기 협력사 포함 / 항만 전체의 기록", "★★ 1년-3년-장기 구조가 또렷합니다. 마지막 문장을 특히 또박또박 말하세요."], ["4", "직무선택", "병원이 아니라 왜 산업현장을 선택하셨습니까?", "경력 전환의 설득력 (간호사 출신에게 필수)", "병원에서 일하며 반복해서 느낀 것이 있습니다. 제 앞에 온 환자는 이미 아픈 상태였다는 것입니다. 할 수 있는 일이 치료와 간호로 한정되어 있었고, 그 사람이 왜 그렇게 됐는지 — 어떤 자세로 몇 시간을 일했고 무엇에 노출됐는지 — 는 제가 손댈 수 없는 영역이었습니다. 산업보건은 그 앞단을 다루는 일이라고 생각했습니다. 작업환경을 바꾸면 한 사람이 아니라 그 공정에서 일하는 모든 사람의 건강이 바뀝니다. 간호사로서 쌓은 관찰과 응급대응 능력은 그대로 쓰면서, 일의 범위를 사후에서 사전으로 옮기고 싶었습니다.", "이미 아픈 상태 / 앞단을 다루는 일 / 한 사람이 아니라 공정 전체 / 관찰·응급은 그대로", "★★ 간호사 출신 지원자의 핵심 서사입니다. '병원이 힘들어서'는 절대 금지."], ["5", "자기소개서", "자기소개서에 쓰신 ○○ 경험에 대해 더 말씀해 주십시오.", "자소서 진위 확인 (반드시 나옴)", "[자기소개서에 쓴 경험 하나하나를 S-T-A-R로 다시 정리해 두세요. 특히 ① 그때 본인이 '직접' 한 행동 ② 숫자로 말할 수 있는 결과 ③ 그 일에서 배운 점을 한 문장으로 — 이 세 가지를 모든 문항마다 준비하세요.]", "자소서의 모든 사례 / 직접 한 행동 / 숫자 결과 / 배운 점", "★★★ 면접 전에 본인 자기소개서를 반드시 출력해 다시 읽으세요. 자소서와 다른 말을 하면 신뢰가 무너집니다. 과장해 쓴 부분이 있으면 '팀으로 했고 제 역할은 ○○였다'로 정직하게 조정해 두세요."]]}, {"name": "08_압박_곤란질문", "title": "압박·곤란한 질문   SHEETS.forEach(function(s){ QA[s.name] = (s.cols.length===7 && s.cols[2].indexOf('예상질문')>=0); });

  var LABEL = {
    '00_면접개요':'개요','01_공사_최근소식':'공사 최근소식','02_뉴스기반_예상질문':'뉴스 기반 질문',
    '03_공통역량_50퍼센트':'공통역량 50%','04_직무역량_50퍼센트':'직무역량 50%',
    '05_최신법령_예상질문':'최신 법령 질문','06_법령개정_암기표':'법령 암기표',
    '07_자기소개_지원동기':'자기소개·지원동기','08_압박_곤란질문':'압박 질문','09_당일_체크리스트':'당일 체크리스트'
  };
  // 표 시트에서 제목으로 쓸 열
  var TITLECOL = {'00_면접개요':1,'01_공사_최근소식':2,'06_법령개정_암기표':1,'09_당일_체크리스트':1};

  var store = {
    get:function(k,d){ try{ var v=localStorage.getItem(k); return v==null?d:JSON.parse(v);}catch(e){return d;} },
    set:function(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }
  };
  var done = store.get('ygpa_done',{});
  var checks = store.get('ygpa_check',{});

  function esc(t){ return String(t==null?'':t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  function deco(t){
    return esc(t).replace(/\[([^\]\n]{1,40})\]/g,'<span class="ph">[$1]</span>')
                 .replace(/(★+)/g,'<span class="star">$1</span>');
  }
  function fld(label,val,cls){
    if(!val) return '';
    return '<div class="fld"><b>'+esc(label)+'</b><div class="'+(cls||'')+'">'+deco(val)+'</div></div>';
  }

  function qaCard(sheet,row,idx){
    var id = sheet+'|'+idx;
    var isDone = !!done[id];
    var kw = (row[5]||'').split(/\s*\/\s*/).filter(Boolean);
    var h = '<article class="card'+(isDone?' done':'')+'" data-id="'+esc(id)+'">';
    h += '<div class="chead"><span class="num">'+esc(row[0]||(idx+1))+'</span><div class="qtext">';
    if(row[1]) h += '<span class="tag">'+deco(row[1])+'</span>';
    h += '<span class="q">'+deco(row[2])+'</span></div>';
    h += '<button class="mark" title="암기 완료 표시" aria-pressed="'+(isDone?'true':'false')+'">'+(isDone?'✓':'○')+'</button></div>';
    h += '<div class="cbody">';
    h += fld('면접관이 보는 것',row[3]);
    h += fld('추천 답변 — 이대로 말해도 됩니다',row[4],'answer');
    if(kw.length) h += '<div class="fld"><b>꼭 넣을 키워드</b><div class="chips">'+kw.map(function(k){return '<span class="chip">'+deco(k)+'</span>';}).join('')+'</div></div>';
    if(row[6]) h += '<div class="fld"><b>주의할 점</b><div class="tip">'+deco(row[6])+'</div></div>';
    h += '</div></article>';
    return h;
  }

  function checkRow(sheet,row,idx){
    var id = sheet+'|'+idx, on = !!checks[id];
    return '<label class="chk'+(on?' on':'')+'" data-check="'+esc(id)+'">'+
      '<input type="checkbox" id="c'+idx+'"'+(on?' checked':'')+'>'+
      '<span class="t"><b>'+deco(row[1])+'</b>'+(row[2]?'<span>'+deco(row[2])+'</span>':'')+'</span></label>';
  }

  function tableRow(sheet,cols,row,idx){
    if(sheet==='09_당일_체크리스트') return checkRow(sheet,row,idx);
    var ti = TITLECOL[sheet]!=null?TITLECOL[sheet]:0;
    var h = '<article class="row">';
    var meta = [];
    for(var j=0;j<cols.length;j++){
      if(j===ti) continue;
      var v = row[j]; if(!v) continue;
      if(String(v).length<=14 && (cols[j].indexOf('시기')>=0||cols[j].indexOf('시행')>=0||cols[j].indexOf('확실도')>=0||cols[j]==='번호'||cols[j]==='구분'))
        meta.push('<span class="chip">'+deco(cols[j]==='번호'?('#'+v):v)+'</span>');
    }
    h += '<div class="rt">'+deco(row[ti])+'</div>';
    if(meta.length) h += '<div class="meta">'+meta.join('')+'</div>';
    h += '<dl>';
    for(var k=0;k<cols.length;k++){
      if(k===ti) continue;
      var val = row[k]; if(!val) continue;
      if(String(val).length<=14 && (cols[k].indexOf('시기')>=0||cols[k].indexOf('시행')>=0||cols[k].indexOf('확실도')>=0||cols[k]==='번호'||cols[k]==='구분')) continue;
      h += '<dt>'+esc(cols[k])+'</dt><dd>'+deco(val)+'</dd>';
    }
    h += '</dl></article>';
    return h;
  }

  function strategy(){
    return '<div class="strategy">'+
      '<div><b>과락이 1순위 위험</b><p>면접위원 과반수가 평정요소 중 <b>하나라도 \'하(40%)\'</b>로 주면 불합격. 모르는 질문도 끝까지 구조를 갖춰 답하세요.</p></div>'+
      '<div><b>동점이면 직무역량</b><p>비중은 50:50이지만 동점자 처리는 직무역량이 5순위, 공통역량이 6순위입니다.</p></div>'+
      '<div><b>토론면접 없음</b><p>보건·기록물 분야는 역량면접(1:다)만 봅니다. 토론 준비는 하지 않아도 됩니다.</p></div>'+
      '</div>';
  }

  function renderSheet(s,si){
    var h = '<section class="sheet" data-sheet="'+si+'">';
    if(si===0) h += strategy();
    h += '<h2 class="sheet-title">'+deco(s.title)+'</h2>';
    var qn = s.rows.filter(function(r){return r[0] && r[0].charAt(0)!=='■';}).length;
    h += '<div class="counter">'+(QA[s.name]?('질문 '+qn+'개'):(qn+'개 항목'))+'</div>';
    if(s.note) h += '<p class="sheet-note">'+deco(s.note)+'</p>';
    s.rows.forEach(function(row,idx){
      if(row[0] && String(row[0]).charAt(0)==='■'){ h += '<h3 class="group">'+deco(String(row[0]).replace(/^■\s*/,''))+'</h3>'; return; }
      h += QA[s.name] ? qaCard(s.name,row,idx) : tableRow(s.name,s.cols,row,idx);
    });
    h += '</section>';
    return h;
  }

  // 탭
  var tabsEl = document.getElementById('tabs'), app = document.getElementById('app');
  var th = '';
  SHEETS.forEach(function(s,i){
    th += '<button role="tab" data-i="'+i+'" aria-selected="'+(i===0?'true':'false')+'"><span class="n">'+s.name.slice(0,2)+'</span>'+esc(LABEL[s.name]||s.name)+'</button>';
  });
  tabsEl.innerHTML = th;

  var cur = 0;
  function show(i){
    cur = i;
    document.getElementById('q').value = '';
    app.innerHTML = renderSheet(SHEETS[i],i);
    Array.prototype.forEach.call(tabsEl.children,function(b,j){ b.setAttribute('aria-selected', j===i?'true':'false'); });
    if(hideOn) applyHide();
    window.scrollTo(0,0);
    try{ tabsEl.children[i].scrollIntoView({block:'nearest',inline:'center'}); }catch(e){}
    try{ location.hash = 'sheet-'+i; }catch(e){}
  }
  tabsEl.addEventListener('click',function(e){
    var b = e.target.closest('button[data-i]'); if(!b) return;
    show(parseInt(b.getAttribute('data-i'),10));
    b.scrollIntoView({block:'nearest',inline:'center'});
  });

  // 검색 — 전체 시트 대상
  var qEl = document.getElementById('q'), timer;
  qEl.addEventListener('input',function(){ clearTimeout(timer); timer = setTimeout(search,160); });
  function search(){
    var t = qEl.value.trim().toLowerCase();
    if(!t){ app.innerHTML = renderSheet(SHEETS[cur],cur); if(hideOn) applyHide(); return; }
    var out = '', n = 0;
    SHEETS.forEach(function(s){
      var hits = '';
      s.rows.forEach(function(row,idx){
        if(row[0] && String(row[0]).charAt(0)==='■') return;
        if(row.join(' ').toLowerCase().indexOf(t) < 0) return;
        n++;
        hits += QA[s.name] ? qaCard(s.name,row,idx) : tableRow(s.name,s.cols,row,idx);
      });
      if(hits) out += '<h3 class="group">'+esc(LABEL[s.name]||s.name)+'</h3>'+hits;
    });
    app.innerHTML = n ? '<div class="hit">\''+esc(qEl.value.trim())+'\' 검색 결과 '+n+'건</div>'+out
                      : '<p class="empty">\''+esc(qEl.value.trim())+'\' 에 해당하는 내용이 없습니다.</p>';
    if(hideOn) applyHide();
  }

  // 카드 접기 / 암기 체크 / 체크리스트
  app.addEventListener('click',function(e){
    var mk = e.target.closest('.mark');
    if(mk){
      e.stopPropagation();
      var card = mk.closest('.card'), id = card.getAttribute('data-id');
      var now = !done[id];
      if(now) done[id] = 1; else delete done[id];
      store.set('ygpa_done',done);
      card.classList.toggle('done',now);
      mk.setAttribute('aria-pressed',now?'true':'false');
      mk.textContent = now?'✓':'○';
      return;
    }
    var head = e.target.closest('.chead');
    if(head){ head.closest('.card').classList.toggle('collapsed'); return; }
  });
  app.addEventListener('change',function(e){
    var lab = e.target.closest('[data-check]'); if(!lab) return;
    var id = lab.getAttribute('data-check');
    if(e.target.checked) checks[id] = 1; else delete checks[id];
    store.set('ygpa_check',checks);
    lab.classList.toggle('on',e.target.checked);
  });

  // 답 가리기
  var hideOn = false, hideBtn = document.getElementById('hide');
  function applyHide(){
    Array.prototype.forEach.call(app.querySelectorAll('.card'),function(c){ c.classList.toggle('collapsed',hideOn); });
  }
  hideBtn.addEventListener('click',function(){
    hideOn = !hideOn;
    hideBtn.setAttribute('aria-pressed',hideOn?'true':'false');
    hideBtn.textContent = hideOn?'답 보이기':'답 가리기';
    applyHide();
  });

  // 테마
  var tBtn = document.getElementById('theme');
  var saved = store.get('ygpa_theme',null);
  if(saved) document.documentElement.setAttribute('data-theme',saved);
  tBtn.addEventListener('click',function(){
    var now = document.documentElement.getAttribute('data-theme');
    var dark = now ? now==='dark'
      : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
    var next = dark?'light':'dark';
    document.documentElement.setAttribute('data-theme',next);
    store.set('ygpa_theme',next);
  });

  window.addEventListener('hashchange',function(){
    var h = /^#sheet-(\d+)$/.exec(location.hash||'');
    if(h && SHEETS[+h[1]] && +h[1] !== cur) show(+h[1]);
  });

  var start = 0;
  var m = /^#sheet-(\d+)$/.exec(location.hash||'');
  if(m && SHEETS[+m[1]]) start = +m[1];
  show(start);
})();
</script>

</body>
</html>
